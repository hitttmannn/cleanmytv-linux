appId: io.github.wingedpanther.cleanmytv
productName: CleanMyTV Linux
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  - from: build/icon.png
    to: icon.png
  - from: build/icons/256x256.png
    to: window-icon.png
  - from: resources/upstream
    to: upstream
  - from: resources/home.apk
    to: home.apk
  - from: resources/home.json
    to: home.json
  - from: resources/signing
    to: signing
# Fuses are switches baked into the Electron binary. Off: running the app as plain Node, NODE_OPTIONS
# and --inspect, which would let another program borrow the app's identity and network permission.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableCookieEncryption: true
  # onlyLoadAppFromAsar stays off: with it the unsigned build exits at launch, and it adds little
  # without code signing and asar integrity checks.
linux:
  icon: build/icons
  category: Utility
  syncDesktopName: true
  maintainer: hitttmannn <hitttmannn@users.noreply.github.com>
  executableName: cleanmytv
  artifactName: CleanMyTV-${version}-${arch}.${ext}
  target:
    - target: deb
      arch: [x64]
deb:
  depends:
    - libgtk-3-0
    - libnss3
    - libxss1
    - libxtst6
    - libatspi2.0-0
    - libdrm2
    - libgbm1
    - libasound2t64
    - libsecret-1-0
    - xdg-utils
    - adb
    - unzip
