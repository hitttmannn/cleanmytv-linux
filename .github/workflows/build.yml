name: Build

# Ubuntu / Linux Mint amd64 only. Release tags create a draft Linux release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the run it replaces, so minutes go to the latest code only.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Read the repository and nothing else; only the release job below can write, and only on a tag.
permissions:
  contents: read

# Actions are pinned to commits (the tag is in the comment), so a moved tag cannot change a build.
jobs:
  apk:
    name: Launcher APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24, cache: npm }
      # JDK 17, the Android SDK and Gradle's downloads (~1 GB) are kept between runs.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .cytv-build/tools/jdk
            .cytv-build/tools/android-sdk
            .cytv-build/tools/gradle
          key: cytv-tools-${{ runner.os }}-${{ hashFiles('home/**/*.gradle.kts', 'home/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: cytv-tools-${{ runner.os }}-
      - run: npm ci
      # Both steps fetch the upstream commit pinned in upstream.json and refuse content that doesn't match.
      - run: npm run sync
      # CleanMyTV Home, the launcher in home/, signed with the key in resources/signing.
      - run: npm run home
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: launcher
          path: |
            resources/home.apk
            resources/home.json
            resources/upstream

  test:
    name: Typecheck and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run sync
      - name: Upstream checkout at the pinned commit (for the recovery.py parity tests)
        run: |
          COMMIT=$(node -p "require('./upstream.json').commit")
          git init -q /tmp/upstream
          git -C /tmp/upstream fetch -q --depth 1 https://github.com/Gathin23/cleanyourtv "$COMMIT"
          git -C /tmp/upstream checkout -q FETCH_HEAD
      - run: npm run typecheck
      - run: UPSTREAM_DIR=/tmp/upstream npm test

  app:
    name: Ubuntu / Linux Mint amd64 DEB
    needs: [apk, test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: node node_modules/electron/install.js
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { name: launcher, path: resources }
      - run: npm run dist:linux
      - name: Check package metadata and dependency resolution
        run: |
          dpkg-deb --info dist/*.deb
          sudo apt-get update
          apt-get -s install ./dist/*.deb
          cd dist
          sha256sum *.deb > SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CleanMyTV-Linux-amd64
          path: |
            dist/*.deb
            dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    name: Draft Ubuntu / Linux Mint release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: app
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - name: Tag matches package.json version
        run: |
          WANT="v$(node -p "require('./package.json').version")"
          [ "$GITHUB_REF_NAME" = "$WANT" ] || { echo "tag $GITHUB_REF_NAME does not match package.json version $WANT"; exit 1; }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { pattern: CleanMyTV-*, path: dist, merge-multiple: true }
      - name: Checksums
        run: cd dist && sha256sum *.deb > SHA256SUMS.txt && cat SHA256SUMS.txt
      # A draft: nothing is public until the owner reviews it and presses Publish. A release made by hand
      # for this tag is left as it is.
      - run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists; leaving it alone"
          else
            gh release create "$GITHUB_REF_NAME" dist/*.deb dist/SHA256SUMS.txt --draft --title "CleanMyTV Linux $GITHUB_REF_NAME — Ubuntu / Linux Mint amd64" --notes-file docs/RELEASE-NOTES.md --repo "$GITHUB_REPOSITORY"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
